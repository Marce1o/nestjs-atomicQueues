syntax = "proto3";

package atomicqueues.v1;

service AtomicQueuesNode {
  // ─── Master ↔ Sub-replica: worker management ──────────────────────────

  // Master tells a replica to spawn a worker for an entity
  rpc SpawnWorker (SpawnWorkerRequest) returns (SpawnWorkerResponse);

  // Master (or peer) sends a message to an entity's worker on this replica
  rpc EnqueueToWorker (EnqueueToWorkerRequest) returns (EnqueueToWorkerResponse);

  // Same but waits for handler result (server-streaming for keepalive)
  rpc EnqueueToWorkerAndWait (EnqueueToWorkerRequest) returns (stream ResultEnvelope);

  // Master tells a replica to teardown an idle worker
  rpc TeardownWorker (TeardownWorkerRequest) returns (TeardownWorkerResponse);

  // Master queries a replica for its active workers (for table rebuild)
  rpc ListWorkers (ListWorkersRequest) returns (ListWorkersResponse);

  // ─── Sub-replica → Master: petition routing ───────────────────────────

  // Sub-replica forwards a handler petition to the master
  rpc Petition (PetitionRequest) returns (PetitionResponse);

  // Same but waits for result
  rpc PetitionAndWait (PetitionRequest) returns (stream ResultEnvelope);

  // Sub-replica tells master a worker went idle
  rpc ReportIdle (ReportIdleRequest) returns (ReportIdleResponse);

  // ─── Master ↔ Master: cross-service ───────────────────────────────────

  // Forward a message to another service's master
  rpc Forward (MessageEnvelope) returns (ForwardAck);

  // Forward and wait for result from another service's master
  rpc ForwardAndWait (MessageEnvelope) returns (stream ResultEnvelope);

  // ─── Health ───────────────────────────────────────────────────────────

  rpc Ping (HealthRequest) returns (HealthResponse);
}

// ─── Messages ─────────────────────────────────────────────────────────────

message MessageEnvelope {
  string id              = 1;
  string name            = 2;
  bytes  payload         = 3;   // JSON-encoded data
  string entity_type     = 4;
  string entity_id       = 5;
  string correlation_id  = 6;
  bool   is_query        = 7;
  int64  enqueued_at     = 8;
  int32  attempts        = 9;
  int32  max_attempts    = 10;
  string origin_server   = 11;
  int32  hops            = 12;
}

message ForwardAck {
  bool   accepted      = 1;
  string reject_reason = 2;
}

message ResultEnvelope {
  string correlation_id = 1;
  oneof outcome {
    bytes  result  = 2;
    string error   = 3;
  }
}

// ─── Worker management (Master → Replica) ─────────────────────────────────

message SpawnWorkerRequest {
  string entity_key = 1;
}

message SpawnWorkerResponse {
  bool   spawned = 1;        // true if new, false if already existed
  string error   = 2;
}

message EnqueueToWorkerRequest {
  string entity_key       = 1;
  MessageEnvelope message = 2;
}

message EnqueueToWorkerResponse {
  bool   accepted      = 1;
  string reject_reason = 2;
}

message TeardownWorkerRequest {
  string entity_key = 1;
}

message TeardownWorkerResponse {
  bool torn_down = 1;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message WorkerInfo {
  string entity_key    = 1;
  int32  queue_depth   = 2;
  bool   is_processing = 3;
  int64  last_active   = 4;
}

// ─── Petition (Replica → Master) ──────────────────────────────────────────

message PetitionRequest {
  string entity_key       = 1;
  MessageEnvelope message = 2;
}

message PetitionResponse {
  bool   accepted      = 1;
  string reject_reason = 2;
}

message ReportIdleRequest {
  string entity_key = 1;
  string replica_id = 2;
}

message ReportIdleResponse {
  bool should_teardown = 1;  // master confirms teardown
}

// ─── Health ───────────────────────────────────────────────────────────────

message HealthRequest {
  string sender_id = 1;
}

message HealthResponse {
  string server_id              = 1;
  bool   is_master              = 2;
  int32  active_workers         = 3;
  int32  queue_depth            = 4;
  repeated string entity_types  = 5;
}
